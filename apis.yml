name: Good Technology
description: 'Good Technology was an enterprise mobile security company whose Good Dynamics platform
  provided app-level encryption, data loss prevention, secure inter-app communication, and a secure
  application-development SDK/API used by ISVs, systems integrators, and enterprises to build secured
  mobile apps across iOS and Android. The company served more than 6,200 organizations, including over
  half of the Fortune 100. Good Technology was acquired by BlackBerry in October 2015 for approximately
  $425 million and folded into BlackBerry''s enterprise mobility (UEM) portfolio; it no longer operates
  as an independent entity and its former developer surface (good.com) now redirects to blackberry.com.
  This profile is retained as a historical company record in the API Evangelist network.'
